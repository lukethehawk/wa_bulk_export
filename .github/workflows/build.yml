name: Build Firefox extension

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Package
        run: npm run package
      - name: Upload Firefox ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wa-bulk-export-firefox
          path: wa-bulk-export-*.zip
